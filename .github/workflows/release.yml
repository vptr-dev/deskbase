name: Release

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  windows:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Release v')
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Identify the release
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$GITHUB_REF_NAME" == main ]]
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            [[ "$(git log -1 --format=%s)" == "Release v$version" ]]
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:connections
      - run: npm run build
      - run: npm run test:widgets
      - name: Build installer and update files
        run: npx electron-builder --win --publish never
      - name: Publish verified installer
        run: |
          set -euo pipefail
          tag="v$VERSION"
          installer="Deskbase-Setup-$VERSION.exe"
          for file in "$installer" "$installer.blockmap" latest.yml; do test -s "dist/$file"; done
          grep -Fq "$installer" dist/latest.yml
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name' > release-tags.txt
          newest=$( { cat release-tags.txt; echo "$tag"; } | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          [[ "$newest" == "$tag" ]]
          sed "s/{version}/$VERSION/g" .github/release-notes.md > notes.md
          if ! grep -Fxq "$tag" release-tags.txt; then
            gh release create "$tag" "dist/$installer" "dist/$installer.blockmap" dist/latest.yml --target "$GITHUB_SHA" --title "Deskbase $VERSION" --notes-file notes.md --latest
          fi
          gh release view "$tag" --json isDraft,isPrerelease,assets --jq 'select(.isDraft == false and .isPrerelease == false) | .assets[] | select(.size > 0) | .name' > assets.txt
          for file in "$installer" "$installer.blockmap" latest.yml; do grep -Fxq "$file" assets.txt; done
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" == "$tag" ]]
          while IFS= read -r old; do
            [[ -n "$old" && "$old" != "$tag" ]] || continue
            gh release delete "$old" --yes
          done < release-tags.txt
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name' > remaining.txt
          [[ "$(cat remaining.txt)" == "$tag" ]]
