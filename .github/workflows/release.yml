name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Package and publish
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install notes and remove older releases
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed "s/{version}/$version/g" .github/release-notes.md > notes.md
          gh release edit "$GITHUB_REF_NAME" --title "Deskbase $version" --notes-file notes.md --latest
          # Only the newest release is kept; older releases are deleted (their git tags stay).
          gh release list --limit 200 --json tagName -q '.[].tagName' | grep -vxF "$GITHUB_REF_NAME" | while read -r tag; do
            gh release delete "$tag" --yes
          done
