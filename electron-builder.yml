appId: com.vptrdev.planner
productName: Planner
copyright: Copyright © 2026 vptr-dev
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
  - '!**/*.map'
  # koffi (desktop widget layering): ship only the Windows x64 binary
  - '!node_modules/koffi/src/**'
  - '!node_modules/koffi/doc/**'
  - '!node_modules/koffi/vendor/**'
  - '!node_modules/koffi/build/koffi/!(win32_x64)/**'
asar: true
asarUnpack:
  - node_modules/koffi/build/koffi/win32_x64/**
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
  artifactName: Planner-Setup-${version}.${ext}
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Planner
publish:
  provider: github
  owner: vptr-dev
  repo: planner
  releaseType: release
