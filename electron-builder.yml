# Kept from the first releases so existing installs upgrade in place.
appId: com.vptrdev.planner
productName: Deskbase
copyright: Copyright © 2026 vptr-dev
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
  - '!**/*.map'
  # koffi (desktop widget layering): ship only the Windows x64 binary
  - '!node_modules/koffi/src/**'
  - '!node_modules/koffi/doc/**'
  - '!node_modules/koffi/vendor/**'
  - '!node_modules/koffi/build/koffi/!(win32_x64)/**'
asar: true
extraResources:
  - from: build/tray.png
    to: tray.png
  - from: build/tray@1.5x.png
    to: tray@1.5x.png
  - from: build/tray@2x.png
    to: tray@2x.png
asarUnpack:
  - node_modules/koffi/build/koffi/win32_x64/**
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
  artifactName: Deskbase-Setup-${version}.${ext}
# Assisted installer: welcome page with build/installerSidebar.bmp, choose a folder, finish with
# "Run Deskbase". Per user, so updates install without an admin prompt.
# Artwork: powershell -NoProfile -File scripts/installer-art.ps1
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  runAfterFinish: true
  uninstallDisplayName: Deskbase
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Deskbase
publish:
  provider: github
  owner: vptr-dev
  repo: deskbase
  releaseType: release
